<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberSys Gestión - Productos</title>
    <link rel="stylesheet" href="css/gestion-pedidos.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">CyberSys<span class="highlight">_</span></div>
            <div class="menu-item">
                <a href="index.html">Inicio</a>
            </div>
            <div class="menu-item">
                <a href="cliente.html">Clientes</a>
            </div>
            <div class="menu-item">
                <a href="vendedores.html">Vendedores</a>
            </div>
            <div class="menu-item">
                <a href="productos.html" class="active">Productos</a>
            </div>
            <div class="menu-item">
                <a href="pedidos.html">Pedidos</a>
            </div>
            <div class="menu-item">
                <a href="detalles-pedido.html">Detalles de Pedido</a>
            </div>
        </div>

        <div class="main-content">
        <div class="header">
                <h1>Gestión de Productos</h1>
            </div>
            <div class="card">
                <div class="search-container">
                    <form id="search-form" class="search-form">
                        <select id="search-type" class="search-select">
                            <option value="id">Buscar por ID</option>
                            <option value="name">Buscar por Nombre</option>
                            <option value="price">Buscar por Precio</option>
                        </select>
                        <input type="text" id="search-input" class="search-input" placeholder="Buscar producto...">
                        <button type="submit" class="btn btn-primary">Buscar</button>
                        <button type="button" class="btn btn-secondary" onclick="fetchProducts()">Mostrar Todos</button>
                    </form>
                    <button class="btn btn-success" id="add-product">Agregar Producto +</button>
                </div>

                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Precio</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="product-list">
                            </tbody>
                    </table>
                </div>
            </div>

            <div id="add-product-modal" class="modal">
                <div class="modal-content">
                    <span class="close" onclick="toggleForm()">&times;</span>
                    <h3>Agregar Nuevo Producto</h3>
                    <form id="product-form" class="form">
                        <input type="hidden" id="product-id" name="product-id">
                        <div class="form-group">
                            <label for="name">Nombre:</label>
                            <input type="text" id="name" name="name" placeholder="Ingrese el nombre" required>
                        </div>
                        <div class="form-group">
                            <label for="price">Precio:</label>
                            <input type="number" step="0.01" id="price" name="price" placeholder="Ingrese el precio" required>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">Guardar</button>
                            <button type="button" class="btn btn-secondary" onclick="toggleForm()">Cancelar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="Js/product.js"></script>
</body>
</html>
