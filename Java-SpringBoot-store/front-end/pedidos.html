<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberSys Gestión - Pedidos</title>
    <link rel="stylesheet" href="css/gestion-pedidos.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">CyberSys<span class="highlight">_</span></div>
            <div class="menu-item">
                <a href="index.html">Inicio</a>
            </div>
            <div class="menu-item">
                <a href="cliente.html">Clientes</a>
            </div>
            <div class="menu-item">
                <a href="vendedores.html">Vendedores</a>
            </div>
            <div class="menu-item">
                <a href="productos.html">Productos</a>
            </div>
            <div class="menu-item">
                <a href="pedidos.html" class="active">Pedidos</a>
            </div>
            <div class="menu-item">
                <a href="detalles-pedido.html">Detalles de Pedido</a>
            </div>
        </div>

        <div class="main-content">
            <div class="header">
                <h1>Gestión de Pedidos</h1>
            </div>
            <div class="card">
                <div class="search-container">
                    <form id="search-form" class="search-form">
                        <select id="search-type" class="search-select">
                            <option value="id">Buscar por ID</option>
                            <option value="client">Buscar por Cliente</option>
                            <option value="seller">Buscar por Vendedor</option>
                        </select>
                        <input type="text" id="search-input" class="search-input" placeholder="Buscar pedido...">
                        <button type="submit" class="btn btn-primary">Buscar</button>
                        <button type="button" id="loadPedidosButton" class="btn btn-secondary">Mostrar Todos</button>
                    </form>
                    <button class="btn btn-success" id="addPedidoButton">Agregar Pedido +</button>
                </div>

                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Fecha</th>
                                <th>Cliente</th>
                                <th>Vendedor</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="pedidosTableBody">
                            </tbody>
                    </table>
                </div>
            </div>

            <div id="pedidoModal" class="modal">
                <div class="modal-content">
                    <span class="close" id="closeModal">&times;</span>
                    <h3 id="modalTitle">Agregar Nuevo Pedido</h3>
                    <form id="pedidoForm" class="form">
                        <input type="hidden" id="pedidoId" name="pedidoId">
                        <div class="form-group">
                            <label for="client">Cliente:</label>
                            <select id="client" name="client" required>
                                <option value="">Seleccione un cliente</option>
                                </select>
                        </div>
                        <div class="form-group">
                            <label for="seller">Vendedor:</label>
                            <select id="seller" name="seller" required>
                                <option value="">Seleccione un vendedor</option>
                                </select>
                        </div>
                        <div class="form-group">
                            <label for="dateOrder">Fecha:</label>
                            <input type="date" id="dateOrder" name="dateOrder" required>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">Guardar</button>
                            <button type="button" id="cancelPedidoButton" class="btn btn-secondary">Cancelar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="Js/orders.js"></script>
</body>
</html>
